# Atualização de dependência que chega como PR, e não como surpresa no dia em
# que alguém for buildar. O PR cai em `develop`, que é onde o trabalho acontece.
#
# **Expo é a exceção**: subir `expo` ou `react-native` fora de um upgrade
# planejado quebra o app inteiro, e a pilha de estilo deste projeto (NativeWind,
# css-interop, Reanimated) já provou ser frágil a isso. Elas ficam ignoradas de
# propósito — a atualização delas é decisão, não rotina.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      # Pacote com ESCOPO não casa com o padrão sem escopo: "expo-*" não pega
      # "@expo/metro-runtime", e foi por essa fresta que chegou um PR subindo
      # esse pacote de 4.0.1 para 57.0.15 — a linha do SDK 54, contra um app no
      # SDK 52. Mesma história em "@react-native-async-storage/async-storage",
      # que o Expo 52 fixa em 1.23.1 e o PR queria levar para 3.1.1
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "nativewind"
      - dependency-name: "react-native-css-interop"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # O Expo 52 casa com o React 18; react-test-renderer acompanha a versão
      # do React, e subi-lo sozinho quebra toda a suíte de render
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react-test-renderer"
      # Zustand 5 muda a API do seletor. É upgrade planejado, não rotina
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
      # A cadeia de build acompanha o SDK, não o calendário do npm:
      # `eslint-config-expo` versiona junto do Expo (a 57 é a linha do SDK 54),
      # e o major do Babel quebra o bundle do Metro antes de quebrar um teste
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "metro"
      - dependency-name: "metro-*"
      # O TypeScript é casado com o `eslint-config-expo` e o
      # `@typescript-eslint` desta linha de SDK. O major (a 7 é o compilador
      # nativo) quebra o `tsc` e o lint antes de quebrar um teste
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      testes:
        patterns: ["jest*", "@testing-library/*", "@types/jest"]
      tipos:
        patterns: ["@types/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: chore
