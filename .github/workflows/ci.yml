name: Economize CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./painel_economico-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -B -DskipTests package

      - name: Test
        env:
          BRAPI_TOKEN: dummy
          GEMINI_API_KEY: dummy
          DB_URL: jdbc:h2:mem:test
          DB_USER: sa
          DB_PASSWORD: sa
          JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_
        run: ./mvnw -B test

  mobile:
    name: Mobile (Expo / React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./painel_economico-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./painel_economico-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint --if-present
