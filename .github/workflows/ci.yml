name: Economize CI

# O fluxo é develop → homolog → main. A esteira roda nos três, e nos PRs entre
# eles: sem isso a proteção de branch não tem em que se apoiar, porque ela exige
# um check que tenha CORRIDO naquele commit.
on:
  push:
    branches: ["develop", "homolog", "main"]
  pull_request:
    branches: ["develop", "homolog", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (Expo / React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        # `--coverage` de propósito: as catracas de cobertura vivem no
        # package.json e só são COBRADAS quando a flag está presente. Sem ela a
        # esteira rodava os testes e deixava a cobertura cair sem avisar
        run: npm test -- --ci --coverage

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
